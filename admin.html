<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin dashboard | Gachok</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="site-header" class="site-header"></header>

<section class="page-hero">
  <div class="container">
    <div class="breadcrumb">Operations</div>
    <h1 style="font-size:2rem;">Admin dashboard</h1>
    <p>Network-wide bookings, route fares, and rider accounts all local to this browser.</p>
  </div>
</section>

<div class="container" style="padding:40px 24px;">
  <div id="notAdmin" class="empty-state" style="display:none;">
    <h3>Admin access required</h3>
    <p>Sign in with the administrator demo account to view this dashboard.</p>
    <a href="login.html" class="btn btn-primary">Sign in</a>
  </div>

  <div id="adminBody" style="display:none;">
    <div class="stat-tiles" id="statTiles"></div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="bookings">All bookings</button>
      <button class="tab-btn" data-tab="payments">All payments</button>
      <button class="tab-btn" data-tab="routes">Route fares</button>
      <button class="tab-btn" data-tab="users">Rider accounts</button>
    </div>

    <div id="tab-bookings" class="tab-panel"></div>
    <div id="tab-payments" class="tab-panel" style="display:none;"></div>
    <div id="tab-routes" class="tab-panel" style="display:none;"></div>
    <div id="tab-users" class="tab-panel" style="display:none;"></div>
  </div>
</div>

<footer id="site-footer" class="site-footer"></footer>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/nav.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
