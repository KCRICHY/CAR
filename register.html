<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Register | Gachok</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="site-header" class="site-header"></header>

<section class="page-hero">
  <div class="container auth-shell" style="text-align:center;">
    <div class="breadcrumb" style="justify-content:center; display:flex;">Create your account</div>
    <h1 style="font-size:2rem;">Join Gachok</h1>
    <p>Takes one form, and everything stays in this browser.</p>
  </div>
</section>

<div class="container" style="padding:40px 24px;">
  <div class="panel auth-shell">
    <div class="form-error" id="regError"></div>
    <form id="registerForm">
      <div class="field" style="margin-bottom:16px;"><label for="name">Full name</label><input id="name" required></div>
      <div class="field" style="margin-bottom:16px;"><label for="email">Email</label><input id="email" type="email" required></div>
      <div class="field" style="margin-bottom:20px;"><label for="password">Password</label><input id="password" type="password" required minlength="6"></div>
      <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>
    <p class="form-note" style="text-align:center; margin-top:18px;">Already have an account? <a href="login.html" style="color:var(--route-blue); font-weight:600;">Sign in</a></p>
  </div>
</div>

<footer id="site-footer" class="site-footer"></footer>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/nav.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("registerForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const res = registerUser({ name, email, password });
    const errEl = document.getElementById("regError");
    if (!res.ok) { errEl.textContent = res.error; errEl.classList.add("show"); return; }
    window.location.href = "index.html";
  });
});
</script>
</body>
</html>
